version: '3.8'

services:
  # 1. Banco de dados do seu projeto de dados
  postgres_lab:
    image: postgres:15-alpine
    container_name: postgres_lab
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: engenharia_dados
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Metastore do Airflow (Banco de Metadados)
  airflow_postgres:
    image: postgres:13-alpine
    container_name: airflow_postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow_password
      POSTGRES_DB: airflow_db
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data

  # 3. Webserver e Scheduler do Airflow (Iniciados em container único para dev)
  airflow:
    image: apache/airflow:2.8.1-python3.10
    container_name: airflow_standalone
    depends_on:
      - airflow_postgres
      - postgres_lab
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow_password@airflow_postgres:5432/airflow_db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./dags:/opt/airflow/dags
    ports:
      - "8080:8080"
    command: >
      bash -c "airflow db init &&
               airflow users create --username admin --firstname Karol --lastname Santos --role Admin --email admin@example.com --password admin &&
               airflow webserver &
               airflow scheduler"

volumes:
  pgdata:
  airflow_pgdata: